name: Deploy to ngalogroup.com (FTP)

# Automatically deploys the site to production whenever main is updated.
# Can also be triggered manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ftp-deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ vars.FTP_PORT || 21 }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./
          server-dir: ${{ vars.FTP_SERVER_DIR || '/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            Logo.jpeg
            logo2.jpeg
            NGALO*.jpeg
            Ngalo Pics*
            Profile detail*.jpg
            Ngalo Updates/**
